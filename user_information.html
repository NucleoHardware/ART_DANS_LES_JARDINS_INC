<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART DANS LES JARDINS INC</title>
    <link rel="stylesheet" href="user_information.css">
    <link rel="icon" href="images_webp/html_icon.webp">
</head>
<body>
    <div class="profile-container">
        <h1>Modifier le profil</h1>
        <form id="profile-form">
            <div class="form-group">
                <label for="profile-picture">Photo de profil :</label>
                <div class="profile-picture-container">
                    <img src="images_webp/default-user.webp" alt="Foto de perfil" id="profile-picture-preview" class="profile-picture">
                    <input type="file" id="profile-picture" accept="image/*" onchange="previewProfilePicture(event)">
                </div>
            </div>
            <div class="form-group">
                <label for="username">Nom:</label>
                <input type="text" id="username" value="Juan Pérez" class="editable">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="juan.perez@example.com" readonly>
            </div>
            <div class="form-group">
                <button type="submit">Enregistrer les modifications</button>
            </div>
            <div class="form-group">
                <a href="/index.html"><button type="button" id="cancel-button">Retour</button></a>
            </div>
        </form>
    </div>

    <script src="user_information.js"></script>
</body>
</html>
